# CI only — deployment happens from the kidastro (portfolio) repo, whose Pages
# workflow checks out this repo, builds it, and serves dist/ at
# kidastro.com/themes. After pushing changes here, trigger that deploy:
#   gh workflow run deploy.yml --repo davekeller/kidastro
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
